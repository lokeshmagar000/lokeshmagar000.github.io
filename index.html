<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO: what Google shows -->
  <title>Lok Bahadur Roka Magar — App Developer & AI Content Creator</title>
  <meta name="description" content="Portfolio of Lok Bahadur Roka Magar, app developer and AI content creator from Nepal. RokaPlayer, RokaConnect and Namaste Facts.">
  <meta name="theme-color" content="#07090f">

  <!-- Open Graph: the preview when someone shares the link -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Lok Bahadur Roka Magar">
  <meta property="og:description" content="App Developer & AI Content Creator from Nepal">
  <meta property="og:image" content="https://lokeshmagar000.github.io/images/namaste-facts/logo.webp">

  <!-- Set the theme BEFORE the page draws, so it never flashes the wrong colour -->
  <script>
    try {
      var saved = localStorage.getItem("theme");
      var theme = saved || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.dataset.theme = theme;
    } catch (e) {}
  </script>

  <!-- Fonts: Inter (English) + Noto Sans Devanagari (Nepali) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap">

  <link rel="stylesheet" href="css/style.css?v=20261126b">
</head>
<body>

  <!-- ===== MENU BAR ===== -->
  <header class="nav" id="nav">
    <a href="#home" class="brand" aria-label="Home">L<span>.</span></a>

    <nav class="nav-links" id="navLinks">
      <a href="#home" data-i18n="navHome">Home</a>
      <a href="#projects" data-i18n="navProjects">Projects</a>
      <a href="#about" data-i18n="navAbout">About</a>
      <a href="#contact" data-i18n="navContact">Contact</a>
    </nav>

    <div class="nav-tools">
      <!-- Language switch: EN | ने -->
      <div class="lang" role="group" aria-label="Language">
        <button data-lang="en" aria-pressed="true">EN</button>
        <button data-lang="ne" aria-pressed="false">ने</button>
      </div>
      <!-- Theme switch: sun / moon -->
      <button class="icon-btn" id="themeBtn" data-i18n-aria="themeLabel" aria-label="Switch light / dark mode">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      </button>
      <!-- Phone menu button (hamburger) -->
      <button class="icon-btn menu-btn" id="menuBtn" data-i18n-aria="menuLabel" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks">
        <span></span><span></span>
      </button>
    </div>
  </header>

  <main>
    <!-- ===== HERO (top section with 3D) ===== -->
    <section class="hero" id="home">
      <canvas id="hero3d" aria-hidden="true"></canvas>
      <div class="hero-fallback" aria-hidden="true"></div>

      <div class="hero-content reveal">
        <div class="avatar" id="avatar"><span>L</span></div>
        <h1 data-i18n="name">Lok Bahadur Roka Magar</h1>
        <p class="tagline" data-i18n="tagline">App Developer & AI Content Creator from Nepal</p>
        <p class="intro" data-i18n="intro"></p>
        <div class="hero-buttons">
          <a href="#projects" class="btn primary" data-i18n="ctaProjects">See my projects</a>
          <a href="#contact" class="btn ghost" data-i18n="ctaContact">Contact me</a>
        </div>
      </div>
      <a href="#projects" class="scroll-hint" aria-hidden="true" tabindex="-1"><span></span></a>
    </section>

    <!-- ===== PROJECTS (filled in by js/main.js from content.js) ===== -->
    <section class="section" id="projects">
      <div class="section-head reveal">
        <h2 data-i18n="projectsTitle">Projects</h2>
        <p data-i18n="projectsSub"></p>
      </div>
      <div class="projects" id="projectList"></div>
    </section>

    <!-- ===== ABOUT ===== -->
    <section class="section" id="about">
      <div class="about glass reveal">
        <h2 data-i18n="aboutTitle">About me</h2>
        <p class="bio" data-i18n="bio"></p>
        <p class="from" data-i18n="aboutFrom"></p>
        <h3 data-i18n="findMe">Find me online</h3>
        <div class="social" id="socialLinks"></div>
      </div>
    </section>

    <!-- ===== CONTACT ===== -->
    <section class="section" id="contact">
      <div class="contact glass reveal">
        <h2 data-i18n="contactTitle">Let's talk</h2>
        <p data-i18n="contactSub"></p>
        <a class="btn primary contact-email" id="emailLink" href="mailto:contact@lokmagar.com.np">contact@lokmagar.com.np</a>
      </div>
    </section>
  </main>

  <footer class="footer"><p data-i18n="footer">© 2026 Lok Bahadur Roka Magar</p></footer>

  <!-- Big picture viewer for screenshots (lightbox) -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="icon-btn lb-close" id="lbClose" data-i18n-aria="closeLabel" aria-label="Close">✕</button>
    <img id="lbImg" alt="">
  </div>

  <noscript><p class="noscript">Please turn on JavaScript to see all of this site.</p></noscript>

  <!-- type="module" lets our JS files import each other -->
  <script type="module" src="js/main.js?v=20261126b"></script>
</body>
</html>
